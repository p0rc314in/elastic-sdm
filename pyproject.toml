[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-sdm"
version = "0.1.0"
description = "Usage pricing for elastic per-request Sparse Delta Memory state"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.2",
  "pyarrow==21.0.0",
  "tiktoken==0.11.0",
  "torch==2.8.0",
]

[tool.setuptools.packages.find]
include = ["elastic_sdm*"]
